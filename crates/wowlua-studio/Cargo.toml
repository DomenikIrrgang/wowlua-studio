[package]
name = "wowlua-studio"
description = "wowlua studio: the IDE for wowlua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
alacritty_terminal = "0.26"
# The clipboard eframe reads with (through egui-winit), for `ctrl shift v`
# in the terminal.
arboard = { version = "3.7", default-features = false }
dirs = "7.0"
eframe.workspace = true
ignore = "0.4"
notify = "8.2"
png = "0.18"
portable-pty = "0.9"
regex = "1.13"
rfd = "0.17"
# Keeps the order of wowlua's config.json when Studio writes `wow.path`.
serde_json = { workspace = true, features = ["preserve_order"] }
wowlua-driver.workspace = true
wowlua-flavors.workspace = true
wowlua-manifest.workspace = true
wowlua-studio-app.workspace = true
wowlua-studio-ui.workspace = true
wowlua-lsp.workspace = true
wowlua-span.workspace = true
wowlua-syntax.workspace = true
wowlua-test.workspace = true

# The system menu bar and the window buttons in Studio's bar (S013, S022).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[lints]
workspace = true
