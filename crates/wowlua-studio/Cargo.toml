[package]
name = "wowlua-studio"
description = "wowlua studio: the IDE for wowlua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
alacritty_terminal = "0.26"
# The clipboard eframe reads with (through egui-winit), for `ctrl shift v`
# in the terminal.
arboard = { version = "3.7", default-features = false }
dirs = "7.0"
eframe.workspace = true
ignore = "0.4"
# The local time a kept profile is named by (M7).
jiff = "0.2"
notify = "8.2"
png = "0.18"
portable-pty = "0.9"
regex = "1.13"
rfd = "0.17"
# Keeps the order of wowlua's config.json when Studio writes `wow.path`.
serde_json = { workspace = true, features = ["preserve_order"] }
# A game session hosted in process, its screen drawn on eframe's device
# (M5, S055).
wowlua-debug.workspace = true
# The explanations of the profiler's hints (M7).
wowlua-diagnostics.workspace = true
wowlua-engine.workspace = true
wowlua-render.workspace = true
wowlua-vm.workspace = true
wowlua-driver.workspace = true
wowlua-flavors.workspace = true
wowlua-manifest.workspace = true
wowlua-studio-app.workspace = true
wowlua-studio-ui.workspace = true
wowlua-lsp.workspace = true
wowlua-span.workspace = true
wowlua-syntax.workspace = true
# The test runner with the renderer's camera, for screenshot tests (M4).
wowlua-test = { workspace = true, features = ["native", "camera"] }

# The system menu bar and the window buttons in Studio's bar (S013, S022);
# a test run kept from App Nap (S054).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", default-features = false, features = ["std"] }
muda = { version = "0.21", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSProcessInfo", "NSString", "block2"] }

[lints]
workspace = true
