[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/DomenikIrrgang/wowlua-studio"
authors = ["Domenik Irrgang"]

[workspace.dependencies]
# The UI: egui drawn with wgpu (decisions S002, S003). egui-wgpu 0.37 uses
# wgpu 30, the version wowlua-render draws the game's screen with, so both
# share one device.
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wowlua-studio-ui = { path = "crates/wowlua-studio-ui" }
wowlua-studio-app = { path = "crates/wowlua-studio-app" }

# wowlua, pinned to a release (decision S004). To work on both repositories
# at once, point these at a local checkout in `.cargo/config.toml` (see
# CLAUDE.md); that file stays out of git.
# Until they are released: the commit of wowlua's pull request #63 (on #62).
# M2 needs #62 (`wowlua new --check …`, `init --no-pkgmeta`, release notes,
# cached_ui_source), M3 #63 (the server's semantic tokens, folding, inlay
# hints, quick fixes and references lenses).
wowlua-driver = { git = "https://github.com/DomenikIrrgang/wowlua", rev = "37214d202b38816a5380f762ccbd717a33163065" }
wowlua-flavors = { git = "https://github.com/DomenikIrrgang/wowlua", rev = "37214d202b38816a5380f762ccbd717a33163065" }
wowlua-manifest = { git = "https://github.com/DomenikIrrgang/wowlua", rev = "37214d202b38816a5380f762ccbd717a33163065" }
wowlua-test = { git = "https://github.com/DomenikIrrgang/wowlua", rev = "37214d202b38816a5380f762ccbd717a33163065" }
wowlua-lsp = { git = "https://github.com/DomenikIrrgang/wowlua", rev = "37214d202b38816a5380f762ccbd717a33163065" }
wowlua-span = { git = "https://github.com/DomenikIrrgang/wowlua", rev = "37214d202b38816a5380f762ccbd717a33163065" }
wowlua-syntax = { git = "https://github.com/DomenikIrrgang/wowlua", rev = "37214d202b38816a5380f762ccbd717a33163065" }

[workspace.lints.rust]
# Denied, not forbidden: one macOS module may allow it (decision S022).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
